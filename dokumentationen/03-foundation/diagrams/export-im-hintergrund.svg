<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" width="1180" height="360" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="360" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Export im Hintergrund</text>
  <text x="30" y="57" class="sub" text-anchor="start">Pakete über den Schlüssel (lazyById), Datei mit Frist; gemessen 3 MB Speicher je Million Zeilen (F-8)</text>
  <rect x="30" y="90" width="205" height="130" rx="10" class="kernhell"/>
  <text x="44" y="118" class="h" text-anchor="start">Auftrag</text>
  <text x="44" y="146" class="t" text-anchor="start">Format, Tabelle oder Abfrage,</text>
  <text x="44" y="166" class="t" text-anchor="start">Struktur und/oder Daten;</text>
  <text x="44" y="186" class="t" text-anchor="start">transfers: queued</text>
  <path d="M235 150 L258 150" class="pfeil"/>
  <rect x="258" y="90" width="205" height="130" rx="10" class="kern"/>
  <text x="272" y="118" class="hw" text-anchor="start">Arbeitsprozess</text>
  <text x="272" y="146" class="tw" text-anchor="start">RunExport: lazyById(5000),</text>
  <text x="272" y="166" class="tw" text-anchor="start">Fortschritt je Paket</text>
  <path d="M463 150 L486 150" class="pfeil"/>
  <rect x="486" y="90" width="205" height="130" rx="10" class="kernhell"/>
  <text x="500" y="118" class="h" text-anchor="start">Datei</text>
  <text x="500" y="146" class="t" text-anchor="start">storage/app/private/transfers,</text>
  <text x="500" y="166" class="t" text-anchor="start">Frist 24 Stunden</text>
  <path d="M691 150 L714 150" class="pfeil"/>
  <rect x="714" y="90" width="205" height="130" rx="10" class="kernhell"/>
  <text x="728" y="118" class="h" text-anchor="start">Benachrichtigung</text>
  <text x="728" y="146" class="t" text-anchor="start">Oberfläche fragt den Stand ab;</text>
  <text x="728" y="166" class="t" text-anchor="start">«Herunterladen» prüft</text>
  <text x="728" y="186" class="t" text-anchor="start">das Recht erneut</text>
  <path d="M919 150 L942 150" class="pfeil"/>
  <rect x="942" y="90" width="205" height="130" rx="10" class="nein"/>
  <text x="956" y="118" class="h" text-anchor="start">Aufräumen</text>
  <text x="956" y="146" class="t" text-anchor="start">model:prune löscht Datei</text>
  <text x="956" y="166" class="t" text-anchor="start">und Eintrag nach Ablauf</text>
  <rect x="30" y="236" width="1115" height="84" rx="10" class="ausbau"/>
  <text x="46" y="262" class="h" text-anchor="start">Ohne laufenden Worker (lokal ohne queue:work)</text>
  <text x="46" y="286" class="t" text-anchor="start">läuft der Export synchron in der Anfrage bis zu einer Grenze (Vorgabe 100'000 Zeilen); darüber verlangt phpdbadmin den Worker (B-07).</text>
  <text x="46" y="306" class="t" text-anchor="start">Import gleich, mit Probelauf in einer zurückgerollten Transaktion und ANALYZE nach dem echten Lauf (E-02, E-06).</text>
</svg>
