<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="660" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Ändern mit Vorschau und Anwenden</text>
  <text x="30" y="57" class="sub" text-anchor="start">Ablauf einer Datenänderung: sammeln im Browser, Vorschau vom Server, Anwenden in einer Transaktion mit Sicherung für Rückgängig</text>
  <rect x="0" y="74" width="180" height="34" rx="6" class="kern"/>
  <text x="90" y="96" class="hw" text-anchor="middle">Person</text>
  <path d="M90 108 L90 575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="210" y="74" width="180" height="34" rx="6" class="kern"/>
  <text x="300" y="96" class="hw" text-anchor="middle">Oberfläche</text>
  <path d="M300 108 L300 575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="450" y="74" width="180" height="34" rx="6" class="kern"/>
  <text x="540" y="96" class="hw" text-anchor="middle">Laravel: ChangeSet</text>
  <path d="M540 108 L540 575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="700" y="74" width="180" height="34" rx="6" class="kern"/>
  <text x="790" y="96" class="hw" text-anchor="middle">Dialekt / Verbindung</text>
  <path d="M790 108 L790 575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="950" y="74" width="180" height="34" rx="6" class="kern"/>
  <text x="1040" y="96" class="hw" text-anchor="middle">Zieldatenbank</text>
  <path d="M1040 108 L1040 575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M90 140 L292 140" class="pfeil"/>
  <rect x="92" y="118" width="207" height="16" rx="4" class="neutral"/>
  <text x="195" y="130" class="s" text-anchor="middle">Zellen ändern (bleibt im Browser)</text>
  <path d="M90 180 L292 180" class="pfeil"/>
  <rect x="151" y="158" width="89" height="16" rx="4" class="neutral"/>
  <text x="195" y="170" class="s" text-anchor="middle">«SQL ansehen»</text>
  <path d="M300 220 L532 220" class="pfeil"/>
  <rect x="296" y="198" width="248" height="16" rx="4" class="neutral"/>
  <text x="420" y="210" class="s" text-anchor="middle">Änderungen (Spalte, alt, neu, Schlüssel)</text>
  <path d="M540 260 L782 260" class="pfeil"/>
  <rect x="559" y="238" width="213" height="16" rx="4" class="neutral"/>
  <text x="665" y="250" class="s" text-anchor="middle">pretend(): Anweisungen + Bindungen</text>
  <path d="M540 300 L308 300" class="pfeil"/>
  <rect x="275" y="278" width="289" height="16" rx="4" class="neutral"/>
  <text x="420" y="290" class="s" text-anchor="middle">Vorschau, Hinweis je Treiber, betroffene Zeilen</text>
  <path d="M90 350 L292 350" class="pfeil"/>
  <rect x="74" y="328" width="242" height="16" rx="4" class="neutral"/>
  <text x="195" y="340" class="s" text-anchor="middle">«Anwenden» (Produktion: Name eintippen)</text>
  <path d="M300 390 L532 390" class="pfeil"/>
  <rect x="305" y="368" width="230" height="16" rx="4" class="neutral"/>
  <text x="420" y="380" class="s" text-anchor="middle">anwenden (mit Prüfsumme der Vorschau)</text>
  <path d="M540 430 L782 430" class="pfeil"/>
  <rect x="550" y="408" width="230" height="16" rx="4" class="neutral"/>
  <text x="665" y="420" class="s" text-anchor="middle">Verbindung je Anfrage, Schreibschutz?</text>
  <path d="M790 470 L1032 470" class="pfeil"/>
  <rect x="770" y="448" width="289" height="16" rx="4" class="neutral"/>
  <text x="915" y="460" class="s" text-anchor="middle">BEGIN · SELECT Vorher-Werte · UPDATE … · COMMIT</text>
  <rect x="430" y="494" width="220" height="26" rx="6" class="ausbau"/>
  <text x="540" y="512" class="s" text-anchor="middle">change_snapshots + audit_log (maskiert)</text>
  <path d="M540 550 L308 550" class="pfeil"/>
  <rect x="296" y="528" width="248" height="16" rx="4" class="neutral"/>
  <text x="420" y="540" class="s" text-anchor="middle">Ergebnis: n Zeilen, «Rückgängig» möglich</text>
  <text x="30" y="600" class="note" text-anchor="start">Strukturänderungen laufen gleich, aber die Vorschau kommt aus Blueprint::toSql() und «Anwenden» folgt dem Verfahren je Treiber (ADR-003).</text>
  <text x="30" y="620" class="note" text-anchor="start">Weicht die Prüfsumme der Vorschau vom neu gebauten SQL ab (jemand hat inzwischen geändert), wird nichts ausgeführt und die Vorschau neu gezeigt.</text>
</svg>
