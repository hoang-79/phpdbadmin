<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Rollen und Anwendungsfälle</text>
  <text x="30" y="57" class="sub" text-anchor="start">Konto-Rolle (Administrator, Mitglied) plus Recht je Verbindung (lesen, schreiben, verwalten)</text>
  <circle cx="160" cy="104" r="18" class="kern"/>
  <text x="160" y="146" class="h" text-anchor="middle">Administrator</text>
  <text x="160" y="164" class="s" text-anchor="middle">Konten, Einladungen, alle Verbindungen</text>
  <rect x="30" y="180" width="260" height="160" rx="10" class="kern"/>
  <text x="46" y="210" class="tw" text-anchor="start">• Konten einladen und entfernen</text>
  <text x="46" y="234" class="tw" text-anchor="start">• Verbindungen anlegen und teilen</text>
  <text x="46" y="258" class="tw" text-anchor="start">• Rechte je Verbindung vergeben</text>
  <text x="46" y="282" class="tw" text-anchor="start">• Protokoll lesen, Fristen sehen</text>
  <circle cx="445" cy="104" r="18" class="kernhell"/>
  <text x="445" y="146" class="h" text-anchor="middle">Recht «lesen»</text>
  <text x="445" y="164" class="s" text-anchor="middle">für eine Verbindung</text>
  <rect x="315" y="180" width="260" height="160" rx="10" class="kernhell"/>
  <text x="331" y="210" class="t" text-anchor="start">• Navigator, Raster, Filter</text>
  <text x="331" y="234" class="t" text-anchor="start">• Struktur ansehen</text>
  <text x="331" y="258" class="t" text-anchor="start">• SQL nur lesend (Wächter)</text>
  <text x="331" y="282" class="t" text-anchor="start">• Export</text>
  <circle cx="730" cy="104" r="18" class="kernhell"/>
  <text x="730" y="146" class="h" text-anchor="middle">Recht «schreiben»</text>
  <text x="730" y="164" class="s" text-anchor="middle">dazu</text>
  <rect x="600" y="180" width="260" height="160" rx="10" class="ausbau"/>
  <text x="616" y="210" class="t" text-anchor="start">• Daten bearbeiten mit Vorschau</text>
  <text x="616" y="234" class="t" text-anchor="start">• Rückgängig</text>
  <text x="616" y="258" class="t" text-anchor="start">• Import</text>
  <text x="616" y="282" class="t" text-anchor="start">• SQL schreibend (nicht auf</text>
  <text x="625" y="306" class="t" text-anchor="start">schreibgeschützter Verbindung)</text>
  <circle cx="1015" cy="104" r="18" class="kernhell"/>
  <text x="1015" y="146" class="h" text-anchor="middle">Recht «verwalten»</text>
  <text x="1015" y="164" class="s" text-anchor="middle">dazu</text>
  <rect x="885" y="180" width="260" height="160" rx="10" class="ausbau"/>
  <text x="901" y="210" class="t" text-anchor="start">• Struktur ändern</text>
  <text x="901" y="234" class="t" text-anchor="start">• Datenbank/Schema anlegen</text>
  <text x="901" y="258" class="t" text-anchor="start">• Server-Verwaltung (v1.1)</text>
  <text x="901" y="282" class="t" text-anchor="start">• Statistik aktualisieren</text>
  <rect x="30" y="360" width="1115" height="80" rx="10" class="nein"/>
  <text x="46" y="386" class="h" text-anchor="start">Für alle Konten</text>
  <text x="46" y="410" class="t" text-anchor="start">Anmelden mit Code oder Passkey · Passkeys und Sitzungen verwalten · Darstellung (hell/dunkel, Dichte, Sprache) · eigene Verbindungen anlegen (persönlich)</text>
  <text x="46" y="430" class="s" text-anchor="start">Kein Profil (Name und E-Mail ändert ein Administrator), keine Selbstregistrierung, kein Dashboard — die Startseite ist die Verbindungsübersicht.</text>
</svg>
