<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="600" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Schreibschutz in Schichten (F-7)</text>
  <text x="30" y="57" class="sub" text-anchor="start">Eine schreibgeschützte Verbindung hält auch, wenn der Mensch im SQL-Editor ausbrechen will</text>
  <rect x="30" y="80" width="760" height="62" rx="8" class="kernhell"/>
  <text x="46" y="106" class="h" text-anchor="start">1  Konto mit Leserechten</text>
  <text x="46" y="126" class="s" text-anchor="start">empfohlen: eigenes Datenbank-Konto je schreibgeschützter Verbindung — das einzige Schloss, das der Server selbst hält</text>
  <rect x="30" y="152" width="760" height="62" rx="8" class="kernhell"/>
  <text x="46" y="178" class="h" text-anchor="start">2  Nur-lesen-Transaktion je Anweisung</text>
  <text x="46" y="198" class="s" text-anchor="start">MySQL/MariaDB: SET SESSION TRANSACTION READ ONLY + Transaktion · PostgreSQL: SET TRANSACTION READ ONLY · immer zurückrollen</text>
  <rect x="30" y="224" width="760" height="62" rx="8" class="kernhell"/>
  <text x="46" y="250" class="h" text-anchor="start">3  Eine Anweisung je Aufruf, vorbereitet</text>
  <text x="46" y="270" class="s" text-anchor="start">keine Mehrfachanweisungen: «COMMIT; INSERT …» scheitert am Server (Syntaxfehler bzw. «multiple commands»)</text>
  <rect x="30" y="296" width="760" height="62" rx="8" class="kernhell"/>
  <text x="46" y="322" class="h" text-anchor="start">4  SQLite: Datei nur lesend öffnen</text>
  <text x="46" y="342" class="s" text-anchor="start">Pdo\Sqlite::OPEN_READONLY — «PRAGMA query_only = OFF» ändert daran nichts</text>
  <rect x="30" y="368" width="760" height="62" rx="8" class="kernhell"/>
  <text x="46" y="394" class="h" text-anchor="start">5  SQLite: Authorizer</text>
  <text x="46" y="414" class="s" text-anchor="start">Pdo\Sqlite::setAuthorizer() — ATTACH nur im erlaubten Ordner; ohne lesbaren Dateinamen (ATTACH ?) verweigert</text>
  <rect x="810" y="80" width="340" height="350" rx="10" class="gruen"/>
  <text x="824" y="106" class="h" text-anchor="start">Ausbruchsversuche</text>
  <text x="824" y="130" class="t" text-anchor="start">MySQL: 9 Versuche, 7 abgewiesen</text>
  <text x="824" y="150" class="t" text-anchor="start">MariaDB: 9 Versuche, 7 abgewiesen</text>
  <text x="824" y="170" class="t" text-anchor="start">PostgreSQL: 12, davon 8 abgewiesen</text>
  <text x="824" y="190" class="t" text-anchor="start">SQLite: 5 Versuche, 4 abgewiesen</text>
  <text x="824" y="210" class="t" text-anchor="start"></text>
  <text x="824" y="230" class="t" text-anchor="start">durchgelassen wurden nur SET … READ</text>
  <text x="824" y="250" class="t" text-anchor="start">WRITE, COMMIT und PRAGMA —</text>
  <text x="824" y="270" class="t" text-anchor="start">ohne Wirkung, weil jede Anweisung</text>
  <text x="824" y="290" class="t" text-anchor="start">neu geschützt wird</text>
  <text x="824" y="310" class="t" text-anchor="start"></text>
  <text x="824" y="330" class="t" text-anchor="start">Bestand danach: unverändert</text>
  <rect x="30" y="450" width="1120" height="100" rx="8" class="rot"/>
  <text x="46" y="476" class="rotT" text-anchor="start">Gefahr ausserhalb des Schreibschutzes: was das Konto auf dem Server darf</text>
  <text x="46" y="500" class="t" text-anchor="start">Herd-Konten «root»: MariaDB liest mit LOAD_FILE('/etc/hosts') Dateien des Rechners, PostgreSQL ist Superuser und liest mit pg_read_file().</text>
  <text x="46" y="520" class="t" text-anchor="start">MySQL 8.4 nicht (secure_file_priv). LOAD DATA LOCAL INFILE verweigert der Client von selbst. → phpdbadmin warnt bei solchen Konten sichtbar.</text>
  <text x="30" y="580" class="note" text-anchor="start">Belegt in SecurityProbeTest; Fehlermeldungen von Laravel enthalten gebundene Werte — vor dem Protokollieren maskieren.</text>
</svg>
