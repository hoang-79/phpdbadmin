<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="500" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — «Anwenden» einer Strukturänderung je Treiber (F-5)</text>
  <text x="30" y="57" class="sub" text-anchor="start">Die Vorschau kommt immer aus Blueprint::toSql() — ausgeführt wird genau sie, aber nicht überall gleich</text>
  <rect x="30" y="80" width="360" height="244" rx="10" class="ausbau"/>
  <rect x="44" y="92" width="127" height="20" rx="10" fill="#0e7490"/>
  <text x="107" y="106" class="badge" text-anchor="middle">NICHT RÜCKROLLBAR</text>
  <text x="44" y="130" class="h" text-anchor="start">MySQL und MariaDB</text>
  <text x="44" y="154" class="t" text-anchor="start">• DDL schliesst jede Transaktion</text>
  <text x="53" y="172" class="t" text-anchor="start">implizit ab</text>
  <text x="44" y="190" class="t" text-anchor="start">• Anweisung für Anweisung,</text>
  <text x="53" y="208" class="t" text-anchor="start">ohne Transaktion</text>
  <text x="44" y="226" class="t" text-anchor="start">• Fehler in Schritt 3: Schritte 1–2</text>
  <text x="53" y="244" class="t" text-anchor="start">bleiben — Vorschau sagt das</text>
  <text x="44" y="262" class="t" text-anchor="start">• Daten (DML) weiterhin in</text>
  <text x="53" y="280" class="t" text-anchor="start">einer Transaktion</text>
  <rect x="410" y="80" width="360" height="244" rx="10" class="gruen"/>
  <rect x="424" y="92" width="88" height="20" rx="10" fill="#0e7490"/>
  <text x="468" y="106" class="badge" text-anchor="middle">RÜCKROLLBAR</text>
  <text x="424" y="130" class="h" text-anchor="start">PostgreSQL</text>
  <text x="424" y="154" class="t" text-anchor="start">• DDL ist transaktional</text>
  <text x="424" y="172" class="t" text-anchor="start">• alle Anweisungen in einer</text>
  <text x="433" y="190" class="t" text-anchor="start">Transaktion</text>
  <text x="424" y="208" class="t" text-anchor="start">• Fehler: alles zurück,</text>
  <text x="433" y="226" class="t" text-anchor="start">nichts halb geändert</text>
  <rect x="790" y="80" width="360" height="244" rx="10" class="gruen"/>
  <rect x="804" y="92" width="184" height="20" rx="10" fill="#0e7490"/>
  <text x="896" y="106" class="badge" text-anchor="middle">RÜCKROLLBAR, MIT VERFAHREN</text>
  <text x="804" y="130" class="h" text-anchor="start">SQLite</text>
  <text x="804" y="154" class="t" text-anchor="start">• Spalte ändern = Tabelle umbauen</text>
  <text x="813" y="172" class="t" text-anchor="start">(Kopie, Daten, Umbenennen)</text>
  <text x="804" y="190" class="t" text-anchor="start">• 1 PRAGMA foreign_keys = OFF</text>
  <text x="813" y="208" class="t" text-anchor="start">ausserhalb der Transaktion</text>
  <text x="804" y="226" class="t" text-anchor="start">• 2 Umbau in der Transaktion</text>
  <text x="804" y="244" class="t" text-anchor="start">• 3 PRAGMA foreign_key_check</text>
  <text x="804" y="262" class="t" text-anchor="start">• 4 Commit, foreign_keys = ON</text>
  <rect x="30" y="340" width="1120" height="110" rx="8" class="rot"/>
  <text x="46" y="366" class="rotT" text-anchor="start">Gemessen, wenn man naiv alles in eine Transaktion legt:</text>
  <text x="46" y="392" class="t" text-anchor="start">MySQL/MariaDB: die Änderung ist geschrieben, danach wirft Laravel «There is no active transaction» — die Oberfläche hielte sie für gescheitert.</text>
  <text x="46" y="412" class="t" text-anchor="start">SQLite: PRAGMA foreign_keys wirkt in einer Transaktion nicht; DROP TABLE der Elterntabelle löscht per ON DELETE CASCADE alle Kinder (0 von 2 übrig).</text>
  <text x="46" y="432" class="t" text-anchor="start">Und: pretend() taugt auf SQLite nicht als Vorschau — die Lesezugriffe liefern leer, heraus kommt «create table … ()».</text>
  <text x="30" y="480" class="note" text-anchor="start">Belegt in DdlPreviewProbeTest: naiver Weg (Gefahr) und Weg je Treiber (2 von 2 Kindern bleiben) auf allen vier Datenbanken.</text>
</svg>
