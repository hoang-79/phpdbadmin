<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Systemkontext (C4 Level 1)</text>
  <text x="30" y="57" class="sub" text-anchor="start">Eine Installation (lokal in Herd oder auf einem Server) mit ihren Personen und Umsystemen</text>
  <rect x="440" y="200" width="300" height="280" rx="16" class="kern"/>
  <text x="590" y="232" class="hw" text-anchor="middle">phpdbadmin</text>
  <text x="590" y="262" class="tw" text-anchor="middle">Laravel-13-Anwendung</text>
  <text x="590" y="284" class="tw" text-anchor="middle">Oberfläche Inertia v3 + Vue 3</text>
  <text x="590" y="306" class="tw" text-anchor="middle">Navigator · Raster · SQL-Editor</text>
  <text x="590" y="328" class="tw" text-anchor="middle">Struktur · Export/Import</text>
  <text x="590" y="350" class="tw" text-anchor="middle">Verbindungen (verschlüsselt)</text>
  <text x="590" y="372" class="tw" text-anchor="middle">Protokoll aller Änderungen</text>
  <text x="590" y="410" class="sw" text-anchor="middle">eigene App-Datenbank:</text>
  <text x="590" y="426" class="sw" text-anchor="middle">Konten, Passkeys, Verbindungen,</text>
  <text x="590" y="442" class="sw" text-anchor="middle">Verlauf, Protokoll (SQLite oder MariaDB)</text>
  <circle cx="62" cy="122" r="12" class="kernhell"/>
  <rect x="40" y="140" width="320" height="48" rx="8" class="kernhell"/>
  <text x="52" y="160" class="h" text-anchor="start">Entwickler</text>
  <text x="52" y="178" class="s" text-anchor="start">lokal in Herd, eigene Datenbanken</text>
  <path d="M360 164 L440 270" class="pfeil"/>
  <circle cx="62" cy="252" r="12" class="kernhell"/>
  <rect x="40" y="270" width="320" height="48" rx="8" class="kernhell"/>
  <text x="52" y="290" class="h" text-anchor="start">Administrator</text>
  <text x="52" y="308" class="s" text-anchor="start">Konten, Verbindungen, Rechte</text>
  <path d="M360 294 L440 328" class="pfeil"/>
  <circle cx="62" cy="382" r="12" class="kernhell"/>
  <rect x="40" y="400" width="320" height="48" rx="8" class="kernhell"/>
  <text x="52" y="420" class="h" text-anchor="start">Mitarbeitende</text>
  <text x="52" y="438" class="s" text-anchor="start">lesen oder bearbeiten je Verbindung</text>
  <path d="M360 424 L440 387" class="pfeil"/>
  <rect x="40" y="520" width="320" height="70" rx="8" class="neutral"/>
  <text x="52" y="544" class="h" text-anchor="start">Authenticator</text>
  <text x="52" y="562" class="s" text-anchor="start">Touch ID, Passwortmanager, Schlüssel</text>
  <text x="52" y="578" class="s" text-anchor="start">(WebAuthn, Passkey)</text>
  <path d="M360 552 L470 480" class="pfeilg"/>
  <rect x="800" y="80" width="340" height="56" rx="8" class="neutral"/>
  <text x="812" y="102" class="h" text-anchor="start">MariaDB-Server</text>
  <text x="812" y="122" class="s" text-anchor="start">10.6 bis 11.x (lokal Herd 10.11)</text>
  <path d="M740 240 L800 108" class="pfeil"/>
  <rect x="800" y="160" width="340" height="56" rx="8" class="neutral"/>
  <text x="812" y="182" class="h" text-anchor="start">MySQL-Server</text>
  <text x="812" y="202" class="s" text-anchor="start">8.0 und 8.4 LTS</text>
  <path d="M740 276 L800 188" class="pfeil"/>
  <rect x="800" y="240" width="340" height="56" rx="8" class="neutral"/>
  <text x="812" y="262" class="h" text-anchor="start">PostgreSQL-Server</text>
  <text x="812" y="282" class="s" text-anchor="start">14 bis 18 (lokal Herd 18)</text>
  <path d="M740 312 L800 268" class="pfeil"/>
  <rect x="800" y="320" width="340" height="56" rx="8" class="neutral"/>
  <text x="812" y="342" class="h" text-anchor="start">SQLite-Dateien</text>
  <text x="812" y="362" class="s" text-anchor="start">auf dem Rechner bzw. Server</text>
  <path d="M740 348 L800 348" class="pfeil"/>
  <rect x="800" y="400" width="340" height="56" rx="8" class="neutral"/>
  <text x="812" y="422" class="h" text-anchor="start">Mail-Versand</text>
  <text x="812" y="442" class="s" text-anchor="start">Anmeldecode, Einladungen</text>
  <path d="M740 384 L800 428" class="pfeil"/>
  <rect x="800" y="480" width="340" height="56" rx="8" class="nein"/>
  <text x="812" y="502" class="h" text-anchor="start">SSH-Bastion</text>
  <text x="812" y="522" class="s" text-anchor="start">Tunnel zu internen Servern (Stufe 4)</text>
  <path d="M740 420 L800 508" class="pfeilg"/>
  <text x="800" y="580" class="note" text-anchor="start">Verbindung je Anfrage, mit Zeit- und Mengengrenzen;</text>
  <text x="800" y="598" class="note" text-anchor="start">erlaubte Hosts je Installation (kein Sprungbrett ins Netz)</text>
</svg>
