<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .cap { font-size: 19px; font-weight: bold; }
    .sub { font-size: 12px; fill: #475569; }
    .h { font-size: 14px; font-weight: bold; }
    .hw { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .t { font-size: 12px; }
    .tw { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 10.5px; fill: #475569; }
    .sw { font-size: 10.5px; fill: #cbd5e1; }
    .badge { font-size: 10px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 11.5px; fill: #475569; font-style: italic; }
    .mono { font-family: Menlo, "SF Mono", monospace; font-size: 11px; }
    .monow { font-family: Menlo, "SF Mono", monospace; font-size: 11px; fill: #e2e8f0; }
    .rotT { font-size: 12px; font-weight: bold; fill: #b42318; }
    .kern { fill: #1e293b; stroke: #1e293b; }
    .kernhell { fill: #eef2f6; stroke: #1e293b; stroke-width: 1.4; }
    .ausbau { fill: #e6f4f7; stroke: #0e7490; stroke-width: 1.4; }
    .gruen { fill: #e7f4ec; stroke: #2f7d4f; stroke-width: 1.4; }
    .nein { fill: #f5f6f8; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
    .rot { fill: #fdecea; stroke: #b42318; stroke-width: 1.4; }
    .flaeche { fill: #f5f6f8; stroke: none; }
    .pfeil { stroke: #1e293b; stroke-width: 1.6; fill: none; marker-end: url(#pf); }
    .pfeilg { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); stroke-dasharray: 5 3; }
    .linie { stroke: #94a3b8; stroke-width: 1.2; fill: none; }
    .achse { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#pfg); }
</style>

  <defs>
    <marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="pfg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="30" y="36" class="cap" text-anchor="start">phpdbadmin — Schichten: eine Oberfläche, vier Dialekte</text>
  <text x="30" y="57" class="sub" text-anchor="start">Was Laravel für alle Treiber kann, nutzen wir; nur die Unterschiede liegen in einem Dialekt je Datenbank</text>
  <rect x="30" y="80" width="820" height="72" rx="10" class="kernhell"/>
  <text x="46" y="108" class="h" text-anchor="start">Browser — Vue 3 + Inertia v3</text>
  <text x="46" y="132" class="s" text-anchor="start">Navigator · Datenraster · SQL-Editor · Strukturformulare · Befehlspalette · SQL-Vorschau</text>
  <rect x="30" y="170" width="820" height="72" rx="10" class="kernhell"/>
  <text x="46" y="198" class="h" text-anchor="start">Laravel 13 — Controller und Dienste</text>
  <text x="46" y="222" class="s" text-anchor="start">Katalog (lesen) · Daten (blättern, ändern) · Struktur (DDL bauen) · Abfrage ausführen · Export/Import (Queue) · Protokoll</text>
  <rect x="30" y="260" width="820" height="72" rx="10" class="ausbau"/>
  <text x="46" y="288" class="h" text-anchor="start">Dialekt-Schicht — ein Vertrag, vier Umsetzungen</text>
  <text x="46" y="312" class="s" text-anchor="start">Bezeichner quoten · Typen · Schemas · Prozesse · Rechte · EXPLAIN · Routinen · Server-Werte · Grenzen setzen</text>
  <rect x="30" y="350" width="820" height="72" rx="10" class="kernhell"/>
  <text x="46" y="378" class="h" text-anchor="start">Laravel-Datenbankschicht</text>
  <text x="46" y="402" class="s" text-anchor="start">Schema::getTables(), getColumns(), getIndexes(), getForeignKeys(), getViews() · Grammatiken · PDO · Verbindung je Anfrage</text>
  <path d="M440 152 L440 168" class="pfeil"/>
  <path d="M440 242 L440 258" class="pfeil"/>
  <path d="M440 332 L440 348" class="pfeil"/>
  <path d="M440 422 L440 438" class="pfeil"/>
  <rect x="30" y="440" width="196" height="64" rx="8" class="neutral"/>
  <text x="42" y="464" class="h" text-anchor="start">MySQL</text>
  <text x="42" y="484" class="s" text-anchor="start">SET max_execution_time</text>
  <rect x="238" y="440" width="196" height="64" rx="8" class="neutral"/>
  <text x="250" y="464" class="h" text-anchor="start">MariaDB</text>
  <text x="250" y="484" class="s" text-anchor="start">max_statement_time</text>
  <rect x="446" y="440" width="196" height="64" rx="8" class="neutral"/>
  <text x="458" y="464" class="h" text-anchor="start">PostgreSQL</text>
  <text x="458" y="484" class="s" text-anchor="start">statement_timeout, Schemas</text>
  <rect x="654" y="440" width="196" height="64" rx="8" class="neutral"/>
  <text x="666" y="464" class="h" text-anchor="start">SQLite</text>
  <text x="666" y="484" class="s" text-anchor="start">Datei, PRAGMA, kein Server</text>
  <text x="30" y="530" class="note" text-anchor="start">Datenbank-Server bzw. -Dateien</text>
  <rect x="880" y="80" width="270" height="424" rx="10" class="kern"/>
  <text x="894" y="106" class="hw" text-anchor="start">Querschnitt (für jede Anfrage)</text>
  <text x="894" y="130" class="tw" text-anchor="start">Verbindung nur aus gespeicherten</text>
  <text x="894" y="149" class="tw" text-anchor="start">Angaben, Hosts nach Liste</text>
  <text x="894" y="168" class="tw" text-anchor="start">Zugangsdaten verschlüsselt</text>
  <text x="894" y="187" class="tw" text-anchor="start">(APP_KEY), nie im Browser</text>
  <text x="894" y="206" class="tw" text-anchor="start">Schreibschutz je Verbindung</text>
  <text x="894" y="225" class="tw" text-anchor="start">Zeitlimit je Anweisung</text>
  <text x="894" y="244" class="tw" text-anchor="start">Zeilengrenze je Ergebnis</text>
  <text x="894" y="263" class="tw" text-anchor="start">SQL-Vorschau vor DDL/DML</text>
  <text x="894" y="282" class="tw" text-anchor="start">Protokoll: wer, wann, was</text>
  <text x="894" y="301" class="tw" text-anchor="start">Rechte: lesen / schreiben /</text>
  <text x="894" y="320" class="tw" text-anchor="start">verwalten je Verbindung</text>
  <text x="30" y="580" class="note" text-anchor="start">Beispiel: «Spalte umbenennen» baut der Dienst Struktur mit dem Dialekt der Verbindung; die Oberfläche zeigt das SQL, erst «Anwenden» führt es aus.</text>
  <text x="30" y="600" class="note" text-anchor="start">SQLite kennt kein ALTER COLUMN — dort baut der Dialekt die Tabelle neu (wie Laravel), die Vorschau zeigt alle Schritte.</text>
</svg>
