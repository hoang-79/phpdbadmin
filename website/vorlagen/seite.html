<!doctype html>
<html lang="{{ sprache }}">
<head>
    <meta charset="utf-8">
    <script>document.documentElement.classList.add('js')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titel }}</title>
    <meta name="description" content="{{ beschreibung }}">
    <meta name="robots" content="{{ robots }}">
    <link rel="canonical" href="{{ url }}">
    <link rel="alternate" hreflang="de" href="{{ de_url }}">
    <link rel="alternate" hreflang="en" href="{{ en_url }}">
    <link rel="alternate" hreflang="x-default" href="{{ de_url }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ root }}favicon.ico" sizes="48x48">
    <link rel="icon" href="{{ root }}favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ root }}apple-touch-icon.png">
    <link rel="preload" href="{{ root }}assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ root }}assets/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ root }}assets/site.css?v={{ css }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="phpdbadmin">
    <meta property="og:title" content="{{ titel }}">
    <meta property="og:description" content="{{ beschreibung }}">
    <meta property="og:url" content="{{ url }}">
    <meta property="og:image" content="{{ basis }}assets/og-bild.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="{{ og_locale }}">
    <meta name="twitter:card" content="summary_large_image">
    {{ jsonld }}
    <script src="{{ root }}assets/site.js?v={{ js }}" defer></script>
</head>
<body>
{{ kopf }}
<main id="inhalt">
{{ inhalt }}
</main>
{{ fuss }}
</body>
</html>
